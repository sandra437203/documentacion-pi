site_name: Documentacion PI
theme:
  name: material
  language: es
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - stylesheets/extra.css
nav:
  - Inicio: index.md
  - 1. Presentación: presentacion.md
  - 2. Caracterización: caracterizacion.md
  - 3. Análisis de requisitos: analisis-requisitos.md
  - 4. Diseño de la solución: diseno-solucion.md
  - 5. Planificación: planificacion.md
  - 6. Modelo de datos: modelo_datos.md
  - 7. Arquitectura: arquitectura.md
  - 8. Desarrollo: desarrollo.md
  - 9. Pruebas: pruebas.md
  - 10. Seguridad: seguridad.md
  - 11. Puesta en marcha: puesta_marcha.md
  - 12. Manuales: manuales.md
  - 13. Conclusiones: conclusiones.md